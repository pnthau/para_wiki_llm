<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Speed Vocab 300 — Nạp 300 từ trong 30 phút</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #0a0a1a;
  color: #e0e0e0;
  min-height: 100vh;
  overflow: hidden;
}

/* === HEADER === */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 12px 20px;
  background: rgba(10,10,26,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 16px; font-weight: 700; }
.header h1 span { color: #fbbf24; }
.cat-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  background: rgba(139,92,246,0.2); color: #a78bfa;
  font-weight: 600; border: 1px solid rgba(139,92,246,0.3);
}
.header-right { display: flex; align-items: center; gap: 16px; }
.counter { font-size: 14px; font-weight: 700; color: #fbbf24; }
.timer-display { font-size: 13px; color: #94a3b8; font-weight: 600; }

/* === PROGRESS BAR === */
.progress-wrap {
  position: fixed; top: 56px; left: 0; right: 0; z-index: 99;
  height: 4px; background: rgba(255,255,255,0.05);
}
.progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #8b5cf6, #ec4899, #fbbf24);
  transition: width 0.3s ease;
  border-radius: 0 2px 2px 0;
}

/* === MAIN CARD AREA === */
.card-area {
  position: fixed; top: 60px; bottom: 120px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  perspective: 1200px;
}

.card-container {
  width: 100%; max-width: 560px; height: 340px;
  cursor: pointer; position: relative;
}
.card {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  backface-visibility: hidden;
  border-radius: 24px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px;
  text-align: center;
}

.card-front {
  background: linear-gradient(145deg, rgba(30,30,60,0.95), rgba(20,20,45,0.98));
  border: 1px solid rgba(139,92,246,0.25);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(139,92,246,0.1);
}
.card-back {
  transform: rotateY(180deg);
  background: linear-gradient(145deg, rgba(45,20,60,0.95), rgba(30,15,45,0.98));
  border: 1px solid rgba(236,72,153,0.25);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(236,72,153,0.1);
}

.word-number {
  font-size: 12px; color: rgba(255,255,255,0.3);
  position: absolute; top: 16px; left: 20px; font-weight: 600;
}
.word-en {
  font-size: 48px; font-weight: 900;
  background: linear-gradient(135deg, #fff, #c4b5fd);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1.2; margin-bottom: 8px;
}
.word-ipa {
  font-size: 16px; color: rgba(167,139,250,0.7);
  margin-bottom: 12px; font-weight: 400;
}
.word-type {
  font-size: 11px; padding: 3px 12px; border-radius: 12px;
  background: rgba(139,92,246,0.15); color: #a78bfa;
  font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
}
.word-vi {
  font-size: 42px; font-weight: 800;
  background: linear-gradient(135deg, #fbbf24, #ec4899);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1.3; margin-bottom: 8px;
}
.word-example {
  font-size: 14px; color: rgba(255,255,255,0.5);
  font-style: italic; max-width: 400px; line-height: 1.5;
}
.flip-hint {
  position: absolute; bottom: 16px;
  font-size: 11px; color: rgba(255,255,255,0.2);
  font-weight: 500;
}

/* === CONTROLS === */
.controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 16px 20px 24px;
  background: rgba(10,10,26,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.06);
}
.controls-top {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 14px;
}
.btn {
  border: none; cursor: pointer; font-family: 'Inter', sans-serif;
  font-weight: 700; border-radius: 14px; transition: all 0.2s;
}
.btn-nav {
  width: 52px; height: 52px; font-size: 20px;
  background: rgba(255,255,255,0.06); color: #e0e0e0;
  border: 1px solid rgba(255,255,255,0.08);
}
.btn-nav:hover { background: rgba(255,255,255,0.12); transform: scale(1.05); }
.btn-flip {
  padding: 14px 36px; font-size: 15px;
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  color: white; border: none;
  box-shadow: 0 4px 20px rgba(139,92,246,0.4);
}
.btn-flip:hover { transform: scale(1.03); box-shadow: 0 6px 30px rgba(139,92,246,0.5); }

.controls-bottom {
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-mode {
  padding: 8px 16px; font-size: 12px;
  background: rgba(255,255,255,0.04); color: #94a3b8;
  border: 1px solid rgba(255,255,255,0.08);
}
.btn-mode:hover { background: rgba(255,255,255,0.08); }
.btn-mode.active {
  background: rgba(251,191,36,0.15); color: #fbbf24;
  border-color: rgba(251,191,36,0.3);
}
.speed-label { font-size: 11px; color: #64748b; font-weight: 600; }

/* === CATEGORY MENU === */
.cat-menu {
  position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
  background: rgba(10,10,26,0.97); backdrop-filter: blur(30px);
  z-index: 200; display: none;
  padding: 30px 20px; overflow-y: auto;
}
.cat-menu.show { display: block; }
.cat-menu h2 {
  font-size: 20px; margin-bottom: 20px;
  background: linear-gradient(135deg, #fbbf24, #ec4899);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.cat-item {
  padding: 14px 18px; margin-bottom: 8px;
  background: rgba(255,255,255,0.04); border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; transition: all 0.2s;
  display: flex; justify-content: space-between; align-items: center;
}
.cat-item:hover { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.3); }
.cat-item-name { font-weight: 700; font-size: 15px; }
.cat-item-count { font-size: 12px; color: #64748b; }
.cat-item-range { font-size: 11px; color: #8b5cf6; }

/* === COMPLETE SCREEN === */
.complete-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10,10,26,0.98);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; z-index: 300; text-align: center; padding: 30px;
}
.complete-screen.show { display: flex; }
.complete-emoji { font-size: 80px; margin-bottom: 20px; }
.complete-title {
  font-size: 32px; font-weight: 900;
  background: linear-gradient(135deg, #fbbf24, #ec4899);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}
.complete-sub { font-size: 16px; color: #94a3b8; margin-bottom: 30px; line-height: 1.6; }
.btn-restart {
  padding: 14px 36px; font-size: 15px;
  background: linear-gradient(135deg, #8b5cf6, #ec4899);
  color: white; border: none; border-radius: 14px;
  font-family: 'Inter', sans-serif; font-weight: 700; cursor: pointer;
}
.btn-restart:hover { transform: scale(1.03); }

/* === AUTO TIMER RING === */
.auto-ring {
  width: 36px; height: 36px; position: relative;
}
.auto-ring svg { transform: rotate(-90deg); }
.auto-ring circle {
  fill: none; stroke-width: 3; cx: 18; cy: 18; r: 15;
}
.auto-ring .bg { stroke: rgba(255,255,255,0.06); }
.auto-ring .fg {
  stroke: #fbbf24; stroke-linecap: round;
  stroke-dasharray: 94.25; stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.1s linear;
}
.auto-ring .time-text {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 10px; font-weight: 700; color: #fbbf24;
}

/* Animations */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}
.card-area.animating .card-container {
  animation: slideIn 0.3s ease forwards;
}

@media (max-width: 480px) {
  .word-en { font-size: 36px; }
  .word-vi { font-size: 32px; }
  .card-container { height: 280px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <h1>⚡ <span>Speed 300</span></h1>
    <div class="cat-badge" id="catBadge">Core Verbs</div>
  </div>
  <div class="header-right">
    <div class="auto-ring" id="autoRing" style="display:none">
      <svg width="36" height="36"><circle class="bg"/><circle class="fg" id="ringFg"/></svg>
      <div class="time-text" id="ringTime">6</div>
    </div>
    <div class="counter"><span id="currentNum">1</span> / 300</div>
  </div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

<!-- CARD -->
<div class="card-area" id="cardArea">
  <div class="card-container" id="cardContainer" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="word-number" id="wordNum">#1</div>
        <div class="word-en" id="wordEn">hello</div>
        <div class="word-ipa" id="wordIpa">/həˈloʊ/</div>
        <div class="word-type" id="wordType">excl.</div>
        <div class="flip-hint">Nhấn để lật →</div>
      </div>
      <div class="card-face card-back">
        <div class="word-number" id="wordNum2">#1</div>
        <div class="word-vi" id="wordVi">xin chào</div>
        <div class="word-example" id="wordEx">"Hello, how are you?"</div>
        <div class="flip-hint">Nhấn để tiếp →</div>
      </div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="controls-top">
    <button class="btn btn-nav" onclick="prevCard()">←</button>
    <button class="btn btn-flip" onclick="flipCard()">LẬT THẺ</button>

  </div>
  <div class="controls-bottom">
    <span class="speed-label">Tốc độ:</span>
    <button class="btn btn-mode" data-speed="0" onclick="setSpeed(0)">Thủ công</button>
    <button class="btn btn-mode active" data-speed="6" onclick="setSpeed(6)">6s ⚡</button>
    <button class="btn btn-mode" data-speed="4" onclick="setSpeed(4)">4s 🔥</button>
    <button class="btn btn-mode" data-speed="3" onclick="setSpeed(3)">3s 💀</button>
    <button class="btn btn-mode" data-speed="0" onclick="toggleCatMenu()">📋 Mục</button>
  </div>
</div>

<!-- CATEGORY MENU -->
<div class="cat-menu" id="catMenu">
  <h2>📋 Chọn nhóm từ</h2>
  <div id="catList"></div>
</div>

<!-- COMPLETE SCREEN -->
<div class="complete-screen" id="completeScreen">
  <div class="complete-emoji">🏆</div>
  <div class="complete-title">HOÀN THÀNH 300 TỪ!</div>
  <div class="complete-sub">
    Não đã tiếp xúc toàn bộ 300 từ cơ bản.<br>
    Lần lướt tiếp sẽ nhớ thêm ~30% nữa.<br>
    Mỗi ngày lướt 1 lần → 1 tuần sẽ thuộc 80%.
  </div>
  <button class="btn btn-restart" onclick="restart()">🔄 Lướt lại từ đầu</button>
</div>

// ===== STATE =====
let currentIndex = 0;
let isFlipped = false;
let autoSpeed = 6; // 0 = manual
let autoTimer = null;
let countdownVal = 0;
let countdownInterval = null;

const CATEGORIES = [...new Set(WORDS.map(w => w.cat))];

// ===== DOM REFS =====
const card = document.getElementById('card');
const wordEn = document.getElementById('wordEn');
const wordIpa = document.getElementById('wordIpa');
const wordType = document.getElementById('wordType');
const wordVi = document.getElementById('wordVi');
const wordEx = document.getElementById('wordEx');
const wordNum = document.getElementById('wordNum');
const wordNum2 = document.getElementById('wordNum2');
const currentNum = document.getElementById('currentNum');
const progressBar = document.getElementById('progressBar');
const catBadge = document.getElementById('catBadge');
const cardArea = document.getElementById('cardArea');
const autoRing = document.getElementById('autoRing');
const ringFg = document.getElementById('ringFg');
const ringTime = document.getElementById('ringTime');
const completeScreen = document.getElementById('completeScreen');

function loadCard(animate = true) {
  if (currentIndex >= WORDS.length) {
    completeScreen.classList.add('show');
    return;
  }
  completeScreen.classList.remove('show');
  const w = WORDS[currentIndex];
  isFlipped = false;
  card.classList.remove('flipped');

  wordEn.textContent = w.en;
  wordIpa.textContent = w.ipa;
  wordType.textContent = w.type;
  wordVi.textContent = w.vi;
  wordEx.textContent = `"${w.ex}"`;
  wordNum.textContent = `#${currentIndex + 1}`;
  wordNum2.textContent = `#${currentIndex + 1}`;
  currentNum.textContent = currentIndex + 1;
  progressBar.style.width = ((currentIndex + 1) / WORDS.length * 100) + '%';
  catBadge.textContent = w.cat;

  if (animate) {
    cardArea.classList.remove('animating');
    void cardArea.offsetWidth;
    cardArea.classList.add('animating');
  }

  resetAutoTimer();
}

function flipCard() {
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
  if (isFlipped && autoSpeed > 0) {
    // after flip, wait half the time then go next
    clearTimeout(autoTimer);
    clearInterval(countdownInterval);
    const halfTime = Math.max(autoSpeed * 500, 1500);
    startCountdown(halfTime / 1000);
    autoTimer = setTimeout(() => nextCard(), halfTime);
  }
}

function nextCard() {
  if (currentIndex < WORDS.length - 1) {
    currentIndex++;
    loadCard(true);
  } else {
    completeScreen.classList.add('show');
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    loadCard(true);
  }
}

function setSpeed(s) {
  autoSpeed = s;
  document.querySelectorAll('.btn-mode[data-speed]').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.speed) === s);
  });
  autoRing.style.display = s > 0 ? 'block' : 'none';
  resetAutoTimer();
}

function resetAutoTimer() {
  clearTimeout(autoTimer);
  clearInterval(countdownInterval);
  if (autoSpeed > 0) {
    startCountdown(autoSpeed);
    autoTimer = setTimeout(() => {
      if (!isFlipped) {
        flipCard();
      } else {
        nextCard();
      }
    }, autoSpeed * 1000);
  }
}

function startCountdown(secs) {
  countdownVal = secs;
  const total = secs;
  const circumference = 94.25;
  ringTime.textContent = Math.ceil(countdownVal);
  ringFg.style.strokeDashoffset = 0;

  clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    countdownVal -= 0.1;
    if (countdownVal <= 0) {
      clearInterval(countdownInterval);
      countdownVal = 0;
    }
    ringTime.textContent = Math.ceil(countdownVal);
    const pct = 1 - (countdownVal / total);
    ringFg.style.strokeDashoffset = circumference * pct;
  }, 100);
}

function toggleCatMenu() {
  const menu = document.getElementById('catMenu');
  menu.classList.toggle('show');
  if (menu.classList.contains('show')) buildCatMenu();
}

function buildCatMenu() {
  const list = document.getElementById('catList');
  list.innerHTML = '';
  let startIdx = 0;
  CATEGORIES.forEach(cat => {
    const count = WORDS.filter(w => w.cat === cat).length;
    const firstIdx = WORDS.findIndex(w => w.cat === cat);
    const div = document.createElement('div');
    div.className = 'cat-item';
    div.innerHTML = `
      <div>
        <div class="cat-item-name">${cat}</div>
        <div class="cat-item-range">Từ #${firstIdx+1} → #${firstIdx+count}</div>
      </div>
      <div class="cat-item-count">${count} từ</div>
    `;
    div.onclick = () => {
      currentIndex = firstIdx;
      loadCard(true);
      document.getElementById('catMenu').classList.remove('show');
    };
    list.appendChild(div);
  });
}

function restart() {
  currentIndex = 0;
  completeScreen.classList.remove('show');
  loadCard(true);
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if(isFlipped) nextCard(); else flipCard(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevCard(); }
  if (e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

// Touch swipe
let touchStartX = 0;
document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 50) {
    if (diff < 0) { if(isFlipped) nextCard(); else flipCard(); }
    else prevCard();
  }
});

// Init
loadCard(false);
</script>
