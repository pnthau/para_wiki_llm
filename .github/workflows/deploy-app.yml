name: Deploy NiX Mastery App

on:
  push:
    branches: [ master ]
    paths:
      - '01_Projects/nix-mastery-app/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          cd 01_Projects/nix-mastery-app
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: 01_Projects/nix-mastery-app/dist
          branch: gh-pages
