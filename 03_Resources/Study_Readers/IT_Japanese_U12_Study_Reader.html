<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Japanese Unit 12 - Study Reader</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e67e22;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 25px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .sentence-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border-left: 8px solid var(--accent-color);
            position: relative;
            transition: transform 0.3s ease;
        }
        .sentence-card:hover {
            transform: translateY(-5px);
        }
        .sentence-num {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            width: 35px;
            height: 35px;
            text-align: center;
            line-height: 35px;
            border-radius: 50%;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .kanji {
            font-size: 26px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .hiragana {
            font-size: 19px;
            color: #7f8c8d;
            margin-bottom: 15px;
            font-style: italic;
        }
        .translation {
            font-size: 22px;
            color: #c0392b;
            font-weight: 600;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #eee;
        }
        .analysis-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 650px) {
            .analysis-section {
                grid-template-columns: 1fr;
            }
        }
        .analysis-box h4 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--secondary-color);
            font-size: 17px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .analysis-box ul {
            margin: 0;
            padding-left: 20px;
            font-size: 16px;
        }
        .analysis-box li {
            margin-bottom: 8px;
        }
        .btn-speak {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-speak:hover {
            background: #27ae60;
            transform: scale(1.05);
        }
        .audio-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Unit 12 Mastery Reader</h1>
        <p>An toàn giao thông & Đi làm mùa đông tại Nhật Bản</p>
    </header>

    <div id="reader-content">
        <!-- Cards will be injected here -->
    </div>
</div>

<script>
    const data = [
        {
            kanji: "日本の 冬は 雪が 降ります。",
            hiragana: "にほんの ふゆは ゆきが ふります",
            translation: "Mùa đông ở Nhật Bản có tuyết rơi.",
            linhKien: [
                "冬 (ふゆ): Mùa đông",
                "雪 (ゆき): Tuyết",
                "降る (ふる): Rơi (mưa, tuyết)"
            ],
            lapGhep: [
                "A は B が V-masu: Tại A thì có B thực hiện hành động V"
            ]
        },
        {
            kanji: "雪が 降ると 車が 渋滞したり バスが 遅れたり します。",
            hiragana: "ゆきが ふると くるまが じゅうたいしたり バスが おくれたり します",
            translation: "Hễ tuyết rơi thì xe hơi bị tắc đường, xe buýt bị muộn.",
            linhKien: [
                "車 (くるま): Xe hơi",
                "渋滞 (じゅうたい): Tắc đường",
                "遅れる (おくれる): Bị muộn, trễ"
            ],
            lapGhep: [
                "V1-ると: Hễ/Khi V1 thì... (Hệ quả tất yếu)",
                "V1 たり V2 たり します: Liệt kê các hành động xảy ra"
            ]
        },
        {
            kanji: "会社に 行くのに いつもより 時間が かかるので 早く 家を 出たほうがいいです。",
            hiragana: "かいしゃに いくのに いつomより じかんが かかるので はやく いえを でたほうがいいです",
            translation: "Vì đi làm mất nhiều thời gian hơn mọi khi nên bạn nên rời nhà sớm hơn.",
            linhKien: [
                "いつもより: So với mọi khi",
                "時間がかかる: Tốn thời gian",
                "家を出す: Rời khỏi nhà"
            ],
            lapGhep: [
                "V-のに: Để làm việc gì đó...",
                "V-ので: Vì... (Giải thích lý do)",
                "V-た ほうがいいです: Nên làm gì đó (Lời khuyên)"
            ]
        },
        {
            kanji: "前の 日から テレビや ラジオで 天気予報を 聞いたり バスの 運行状況を インターネットで 確認してください。",
            hiragana: "まえの ひから テレビや ラジオで てんきよほうを きいたり バスの うんこうじょうきょうを インターネットで かくにんしてください",
            translation: "Từ ngày hôm trước, hãy nghe dự báo thời tiết hoặc kiểm tra tình trạng xe buýt.",
            linhKien: [
                "前の日 (まえのひ): Ngày hôm trước",
                "天気予報 (てんきよほう): Dự báo thời tiết",
                "運行状況 (うんこうじょうきょう): Tình trạng vận hành",
                "確認 (かくにん): Xác nhận, kiểm tra"
            ],
            lapGhep: [
                "A や B: A và B (liệt kê không đầy đủ)",
                "V-てください: Hãy làm... (Yêu cầu)"
            ]
        },
        {
            kanji: "雪が 積もると 滑りやすくなります。",
            hiragana: "ゆきが つもると すべりやすくなります",
            translation: "Hễ tuyết tích tụ thì sẽ trở nên dễ trơn trượt.",
            linhKien: [
                "積む (つむ): Tích tụ, chất đống",
                "滑る (すべる): Trơn, trượt"
            ],
            lapGhep: [
                "V-bỏ masu + やすい: Dễ làm việc gì đó",
                "～なります: Trở nên, trở thành"
            ]
        },
        {
            kanji: "滑って 転ぶと ケガを します。歩く 時は 気をつけてください。",
            hiragana: "すべって ころぶと ケガを します。あるく ときは きをつけてください",
            translation: "Nếu trượt ngã sẽ bị thương. Khi đi bộ hãy cẩn thận.",
            linhKien: [
                "転ぶ (ころぶ): Ngã",
                "ケガ: Vết thương / Bị thương",
                "気をつける: Cẩn thận"
            ],
            lapGhep: [
                "V1-て V2: Làm V1 rồi V2 (Liên kết)",
                "V-る 時 (とき): Khi làm việc gì đó..."
            ]
        },
        {
            kanji: "滑らない 靴を 履いたほうがいいです。自転車や バイクには 乗らないほうがいいと 思います。",
            hiragana: "すべらない くつを はいたほうがいいです。じてんしゃや バイクには のらないほうがいいと おもいます",
            translation: "Bạn nên đi giày không trơn. Tôi nghĩ là không nên đi xe đạp hay xe máy.",
            linhKien: [
                "靴 (くつ): Giày",
                "履く (はく): Đi (giày)",
                "自転車 (じてんしゃ): Xe đạp",
                "バイク: Xe máy"
            ],
            lapGhep: [
                "V-ない ほうがいいです: Không nên làm gì đó",
                "～と 思います: Tôi nghĩ rằng..."
            ]
        }
    ];

    function speak(text) {
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'ja-JP';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
    }

    const container = document.getElementById('reader-content');

    data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'sentence-card';
        
        let linhKienHtml = item.linhKien.map(li => `<li>${li}</li>`).join('');
        let lapGhepHtml = item.lapGhep.map(li => `<li>${li}</li>`).join('');

        card.innerHTML = `
            <button class="btn-speak" onclick="speak('${item.kanji}')">
                <span class="audio-icon">🔊</span> Nghe
            </button>
            <div class="sentence-num">${index + 1}</div>
            <div class="kanji">${item.kanji}</div>
            <div class="hiragana">(${item.hiragana})</div>
            <div class="translation">=> ${item.translation}</div>
            <div class="analysis-section">
                <div class="analysis-box">
                    <h4>🔧 Linh kiện</h4>
                    <ul>${linhKienHtml}</ul>
                </div>
                <div class="analysis-box">
                    <h4>🏗️ Lắp ghép</h4>
                    <ul>${lapGhepHtml}</ul>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
</script>

</body>
</html>
