<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Japanese Unit 11 - Study Reader</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--primary-color);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .sentence-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 6px solid var(--secondary-color);
            transition: transform 0.2s;
        }
        .sentence-card:hover {
            transform: translateY(-5px);
        }
        .sentence-num {
            display: inline-block;
            background: var(--secondary-color);
            color: white;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            border-radius: 50%;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .kanji {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        .hiragana {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
        }
        .translation {
            font-size: 20px;
            color: var(--accent-color);
            font-weight: 500;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ddd;
        }
        .analysis-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .analysis-section {
                grid-template-columns: 1fr;
            }
        }
        .analysis-box h4 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--secondary-color);
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .analysis-box ul {
            margin: 0;
            padding-left: 20px;
            font-size: 15px;
        }
        .analysis-box li {
            margin-bottom: 5px;
        }
        .btn-speak {
            float: right;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.3s;
        }
        .btn-speak:hover {
            background: #27ae60;
        }
        .audio-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Unit 11 Mastery Reader</h1>
        <p>Phân tích chi tiết Video: Project Leader & Kỷ luật báo cáo</p>
    </header>

    <div id="reader-content">
        <!-- Cards will be injected here -->
    </div>
</div>

<script>
    const data = [
        {
            kanji: "プロジェクトリーダーは 大変な 仕事です。",
            hiragana: "たいへんな しごとです",
            translation: "Project Leader là một công việc vất vả.",
            linhKien: [
                "プロジェクトリーダー: Project Leader",
                "大変 (たいへん): Vất vả, cực nhọc",
                "仕事 (しごと): Công việc"
            ],
            lapGhep: [
                "A は B です: A là B",
                "大変な + Danh từ: Tính từ đuôi na bổ nghĩa cho danh từ"
            ]
        },
        {
            kanji: "チームメンバーの 仕事量を 調整したり、開発ソースの 品質分析を 行わなければなりません。",
            hiragana: "しごとりょうを ちょうせいしたり、かいはつソースの ひんしつぶんせきを おこな わなければなりません",
            translation: "(PL) phải điều chỉnh lượng công việc của thành viên, và phải tiến hành phân tích chất lượng mã nguồn.",
            linhKien: [
                "仕事量 (しごとりょう): Lượng công việc",
                "調整 (ちょうせい): Điều chỉnh",
                "開発ソース: Mã nguồn phát triển",
                "品質分析 (ひんしつぶんせき): Phân tích chất lượng",
                "行う (おこなう): Tiến hành, thực hiện"
            ],
            lapGhep: [
                "V1 たり, V2 ...: Liệt kê các hành động không theo thứ tự",
                "V-なければなりません: Bắt buộc phải làm (Trang trọng)"
            ]
        },
        {
            kanji: "また 課題の 解決も しないといけません。",
            hiragana: "また かだいの かいけつも しないといけません",
            translation: "Ngoài ra cũng phải giải quyết các vấn đề/task nữa.",
            linhKien: [
                "また: Ngoài ra, thêm nữa",
                "課題 (かだい): Vấn đề, task",
                "解決 (かいけつ): Giải quyết"
            ],
            lapGhep: [
                "V-ないといけません: Phải làm (Thông dụng trong văn phòng)"
            ]
        },
        {
            kanji: "締め切りに 間に合うよう 開発しなければなりません。",
            hiragana: "しめきりに まにあうよう かいはつしなければなりません",
            translation: "Phải phát triển sao cho kịp với hạn chót (deadline).",
            linhKien: [
                "締め切り (しめきり): Deadline, hạn cuối",
                "間に合う (まにあう): Kịp thời gian"
            ],
            lapGhep: [
                "V1 よう V2: Làm V2 để đạt được mục đích V1"
            ]
        },
        {
            kanji: "そのために 日々の 進捗管理が 重要です。",
            hiragana: "そのために ひびの しんちょくかんりが じゅうようですか",
            translation: "Vì vậy, việc quản lý tiến độ hằng ngày là rất quan trọng.",
            linhKien: [
                "そのために: Vì lý do đó",
                "日々 (ひび): Hàng ngày",
                "進捗管理 (しんちょくかんり): Quản lý tiến độ",
                "重要 (じゅうよう): Quan trọng"
            ],
            lapGhep: []
        },
        {
            kanji: "会社や お客様に対して プロジェクトの 進捗状況を 報告しなければなりません。",
            hiragana: "かいしゃや おきゃくさまに たいして プロジェクトの しんちょくじょうきょうを ほうこくしなければなりません",
            translation: "Phải báo cáo tình hình tiến độ dự án cho công ty và khách hàng.",
            linhKien: [
                "会社 (かいしゃ): Công ty",
                "お客様 (おきゃくさま): Khách hàng",
                "進捗状況 (しんちょくじょうきょう): Tình hình tiến độ",
                "報告 (ほうこく): Báo cáo"
            ],
            lapGhep: [
                "～に対して: Đối với... / Cho..."
            ]
        },
        {
            kanji: "そのために 報告書も 作成しないといけません。",
            hiragana: "そのために ほうこくしょも さくせいしないといけません",
            translation: "Vì lý do đó, (PL) cũng phải lập các bản báo cáo.",
            linhKien: [
                "報告書 (ほうこくしょ): Bản báo cáo (văn bản)",
                "作成 (さくせい): Lập, tạo ra"
            ],
            lapGhep: []
        },
        {
            kanji: "会議にも 参加しないといけません。",
            hiragana: "かいぎにも さんかしないといけません",
            translation: "(PL) cũng phải tham gia vào các cuộc họp nữa.",
            linhKien: [
                "会議 (かいぎ): Cuộc họp",
                "参加 (さんか): Tham gia"
            ],
            lapGhep: []
        },
        {
            kanji: "ですから プロジェクトメンバーは 必ず 進捗状況を 報告してください。",
            hiragana: "ですから プロジェクトメンバーは かならず しんちょくじょうきょうを ほうこくしてください",
            translation: "Cho nên, các thành viên dự án nhất định hãy báo cáo tình hình tiến độ.",
            linhKien: [
                "ですから: Vì thế, cho nên (Kết luận)",
                "必ず (かならず): Nhất định, 100%"
            ],
            lapGhep: [
                "V-てください: Hãy làm... (Yêu cầu lịch sự)"
            ]
        },
        {
            kanji: "報告をしないで 休むようなことは 絶対に しないでください。",
            hiragana: "ほうこくをしないで やすむようなことは ぜったいに しないでください",
            translation: "Tuyệt đối đừng bao giờ làm những việc kiểu như tự ý nghỉ mà không báo cáo.",
            linhKien: [
                "休む (やすむ): Nghỉ làm",
                "絶対に (ぜったいに): Tuyệt đối"
            ],
            lapGhep: [
                "V-ないで: Làm gì đó mà không làm V",
                "V-ないでください: Xin đừng làm... (Cấm đoán)"
            ]
        }
    ];

    function speak(text) {
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'ja-JP';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
    }

    const container = document.getElementById('reader-content');

    data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'sentence-card';
        
        let linhKienHtml = item.linhKien.map(li => `<li>${li}</li>`).join('');
        let lapGhepHtml = item.lapGhep.map(li => `<li>${li}</li>`).join('');

        card.innerHTML = `
            <button class="btn-speak" onclick="speak('${item.kanji}')">
                <span class="audio-icon">🔊</span> Nghe
            </button>
            <div class="sentence-num">${index + 1}</div>
            <div class="kanji">${item.kanji}</div>
            <div class="hiragana">(${item.hiragana})</div>
            <div class="translation">=> ${item.translation}</div>
            <div class="analysis-section">
                <div class="analysis-box">
                    <h4>🔧 Linh kiện</h4>
                    <ul>${linhKienHtml}</ul>
                </div>
                <div class="analysis-box">
                    <h4>🏗️ Lắp ghép</h4>
                    <ul>${lapGhepHtml}</ul>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
</script>

</body>
</html>
