<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Shadowing Player v1.0 - Hau-san Sensei</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --accent: #f43f5e;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --success: #10b981;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 600px;
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 4px; }
        header p { font-size: 0.875rem; color: var(--text-muted); }

        .main-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }

        .upload-area:hover { border-color: var(--primary); background: #f9fafb; }
        .upload-area input { display: none; }
        .upload-icon { font-size: 2rem; margin-bottom: 8px; display: block; }

        /* Controls */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 24px 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn:disabled { background: #d1d5db; cursor: not-allowed; }
        .btn-accent { background: var(--accent); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn:active { transform: scale(0.95); }

        /* Progress & Status */
        .status-panel {
            background: #f9fafb;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }

        .timer-display {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            margin: 12px 0;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.1s linear;
        }

        /* Settings */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f3f4f6;
        }

        .setting-item label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .setting-item input {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.875rem;
        }

        /* Chunk List */
        .chunk-list {
            margin-top: 24px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
        }

        .chunk-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.1s;
        }

        .chunk-item:hover { background: #f9fafb; }
        .chunk-item.active { background: #eef2ff; border-left: 4px solid var(--primary); }
        .chunk-time { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
        .chunk-id { font-weight: 600; font-size: 0.9rem; }

        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p style="margin-top: 10px; font-weight: 600;">Đang phân tích âm thanh...</p>
</div>

<header>
    <h1>Nexus Shadowing Player</h1>
    <p>Tự động cắt câu - Luyện phản xạ N5</p>
</header>

<main class="main-container">
    <div class="upload-area" id="drop-zone">
        <span class="upload-icon">📁</span>
        <p>Thả file Audio (MP3/WAV) vào đây hoặc <strong>Bấm để chọn</strong></p>
        <input type="file" id="file-input" accept="audio/*">
    </div>

    <div id="player-ui" style="display: none;">
        <div class="status-panel">
            <div id="status-text" style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted);">Sẵn sàng</div>
            <div class="timer-display" id="main-timer">00:00 / 00:00</div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="sub-status" style="font-size: 0.75rem; color: var(--text-muted);">Chọn file để bắt đầu</div>
        </div>

        <div class="player-controls">
            <button class="btn btn-outline" id="prev-btn">⏮</button>
            <button class="btn" id="play-pause-btn">▶ Play</button>
            <button class="btn btn-outline" id="next-btn">⏭</button>
        </div>

        <div class="settings-grid">
            <div class="setting-item">
                <label>Độ nhạy (Threshold)</label>
                <input type="number" id="cfg-threshold" value="0.02" step="0.01" min="0.005">
            </div>
            <div class="setting-item">
                <label>K.lặng tối thiểu (s)</label>
                <input type="number" id="cfg-silence-len" value="0.5" step="0.1" min="0.1">
            </div>
            <div class="setting-item">
                <label>Nghỉ tối thiểu (s)</label>
                <input type="number" id="cfg-pause-min" value="10" step="1" min="1">
            </div>
            <div class="setting-item">
                <label>Hệ số nghỉ (x lần câu)</label>
                <input type="number" id="cfg-pause-factor" value="2" step="0.5" min="1">
            </div>
        </div>

        <div class="chunk-list" id="chunk-list">
            <!-- Chunks will be rendered here -->
        </div>
    </div>
</main>

<script>
    /**
     * Nexus Shadowing Player Logic
     * Tuân thủ Single Responsibility & Clean Code
     */

    const App = {
        audioCtx: new (window.AudioContext || window.webkitAudioContext)(),
        audioBuffer: null,
        chunks: [],
        currentIndex: -1,
        isPlaying: false,
        sourceNode: null,
        playbackStartTime: 0,
        pauseTimeout: null,
        
        // Cấu hình
        config: {
            threshold: 0.02,
            minSilenceDuration: 0.5,
            minPauseTime: 10,
            pauseFactor: 2
        },

        elements: {
            fileInput: document.getElementById('file-input'),
            dropZone: document.getElementById('drop-zone'),
            playerUI: document.getElementById('player-ui'),
            playPauseBtn: document.getElementById('play-pause-btn'),
            statusText: document.getElementById('status-text'),
            subStatus: document.getElementById('sub-status'),
            timer: document.getElementById('main-timer'),
            progressBar: document.getElementById('progress-bar'),
            chunkList: document.getElementById('chunk-list'),
            loading: document.getElementById('loading-overlay'),
            nextBtn: document.getElementById('next-btn'),
            prevBtn: document.getElementById('prev-btn')
        },

        init() {
            this.bindEvents();
        },

        bindEvents() {
            this.elements.dropZone.onclick = () => this.elements.fileInput.click();
            this.elements.fileInput.onchange = (e) => this.handleFileSelect(e);
            this.elements.playPauseBtn.onclick = () => this.togglePlayback();
            this.elements.nextBtn.onclick = () => this.jumpChunk(1);
            this.elements.prevBtn.onclick = () => this.jumpChunk(-1);

            // Cập nhật config realtime
            document.getElementById('cfg-threshold').onchange = (e) => this.config.threshold = parseFloat(e.target.value);
            document.getElementById('cfg-silence-len').onchange = (e) => this.config.minSilenceDuration = parseFloat(e.target.value);
            document.getElementById('cfg-pause-min').onchange = (e) => this.config.minPauseTime = parseFloat(e.target.value);
            document.getElementById('cfg-pause-factor').onchange = (e) => this.config.pauseFactor = parseFloat(e.target.value);
        },

        async handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            this.elements.loading.style.display = 'flex';
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                this.audioBuffer = await this.audioCtx.decodeAudioData(arrayBuffer);
                this.analyzeAudio();
                this.elements.playerUI.style.display = 'block';
                this.elements.dropZone.style.display = 'none';
                this.renderChunks();
            } catch (err) {
                alert("Lỗi xử lý file: " + err.message);
            } finally {
                this.elements.loading.style.display = 'none';
            }
        },

        analyzeAudio() {
            const data = this.audioBuffer.getChannelData(0);
            const sampleRate = this.audioBuffer.sampleRate;
            const threshold = this.config.threshold;
            const minSilenceSamples = this.config.minSilenceDuration * sampleRate;
            
            let chunks = [];
            let isSilence = true;
            let currentStart = 0;
            let silenceCount = 0;

            // Quét dữ liệu với window size 512 samples (~11ms)
            const windowSize = 512;
            for (let i = 0; i < data.length; i += windowSize) {
                let rms = 0;
                for (let j = 0; j < windowSize && (i + j) < data.length; j++) {
                    rms += data[i + j] * data[i + j];
                }
                rms = Math.sqrt(rms / windowSize);

                if (rms < threshold) {
                    silenceCount += windowSize;
                } else {
                    if (isSilence) {
                        currentStart = i / sampleRate;
                        isSilence = false;
                    }
                    silenceCount = 0;
                }

                if (!isSilence && silenceCount > minSilenceSamples) {
                    let end = i / sampleRate;
                    if (end - currentStart > 0.3) { // Bỏ qua đoạn quá ngắn
                        chunks.push({ start: currentStart, end: end });
                    }
                    isSilence = true;
                }
            }

            // Chunk cuối cùng
            if (!isSilence) {
                chunks.push({ start: currentStart, end: this.audioBuffer.duration });
            }

            this.chunks = chunks;
            this.currentIndex = chunks.length > 0 ? 0 : -1;
        },

        renderChunks() {
            this.elements.chunkList.innerHTML = '';
            this.chunks.forEach((chunk, index) => {
                const div = document.createElement('div');
                div.className = `chunk-item ${index === this.currentIndex ? 'active' : ''}`;
                div.onclick = () => this.playChunk(index);
                
                const dur = (chunk.end - chunk.start).toFixed(1);
                div.innerHTML = `
                    <span class="chunk-id">Câu ${index + 1}</span>
                    <span class="chunk-time">${chunk.start.toFixed(1)}s - ${chunk.end.toFixed(1)}s (${dur}s)</span>
                `;
                this.elements.chunkList.appendChild(div);
            });
        },

        togglePlayback() {
            if (this.isPlaying) {
                this.stopCurrent();
            } else {
                this.playChunk(this.currentIndex === -1 ? 0 : this.currentIndex);
            }
        },

        stopCurrent() {
            if (this.sourceNode) {
                this.sourceNode.stop();
                this.sourceNode = null;
            }
            clearTimeout(this.pauseTimeout);
            this.isPlaying = false;
            this.elements.playPauseBtn.innerHTML = '▶ Play';
            this.elements.statusText.innerHTML = 'Tạm dừng';
        },

        playChunk(index) {
            if (index < 0 || index >= this.chunks.length) return;
            
            this.stopCurrent();
            this.currentIndex = index;
            this.renderChunks();
            
            const chunk = this.chunks[index];
            const duration = chunk.end - chunk.start;

            this.sourceNode = this.audioCtx.createBufferSource();
            this.sourceNode.buffer = this.audioBuffer;
            this.sourceNode.connect(this.audioCtx.destination);
            
            this.sourceNode.start(0, chunk.start, duration);
            this.isPlaying = true;
            this.elements.playPauseBtn.innerHTML = '⏸ Pause';
            this.elements.statusText.innerHTML = 'Đang phát câu ' + (index + 1);
            
            // Animation thanh tiến trình
            this.animateProgress(duration);

            this.sourceNode.onended = () => {
                if (this.isPlaying) {
                    this.startPauseCycle(duration);
                }
            };
        },

        animateProgress(duration) {
            this.elements.progressBar.style.transition = 'none';
            this.elements.progressBar.style.width = '0%';
            
            // Force reflow
            this.elements.progressBar.offsetHeight;
            
            this.elements.progressBar.style.transition = `width ${duration}s linear`;
            this.elements.progressBar.style.width = '100%';
        },

        startPauseCycle(chunkDuration) {
            this.sourceNode = null;
            this.elements.statusText.innerHTML = 'Nghỉ Shadowing';
            
            const waitTime = Math.max(this.config.minPauseTime, chunkDuration * this.config.pauseFactor);
            let remaining = waitTime;

            const updateTimer = () => {
                if (!this.isPlaying) return;
                
                this.elements.subStatus.innerHTML = `Câu tiếp theo trong: ${remaining.toFixed(1)}s`;
                this.elements.timer.innerHTML = `Nghỉ: ${remaining.toFixed(1)}s / ${waitTime.toFixed(1)}s`;
                
                // Progress bar cho đoạn nghỉ
                const percent = (1 - (remaining / waitTime)) * 100;
                this.elements.progressBar.style.transition = 'none';
                this.elements.progressBar.style.width = percent + '%';

                if (remaining <= 0) {
                    this.jumpChunk(1);
                } else {
                    remaining -= 0.1;
                    this.pauseTimeout = setTimeout(updateTimer, 100);
                }
            };

            updateTimer();
        },

        jumpChunk(delta) {
            const next = this.currentIndex + delta;
            if (next >= 0 && next < this.chunks.length) {
                this.playChunk(next);
            } else {
                this.stopCurrent();
                this.elements.statusText.innerHTML = 'Hoàn thành!';
                this.elements.subStatus.innerHTML = 'Đã hết file audio.';
            }
        }
    };

    document.addEventListener('DOMContentLoaded', () => App.init());
</script>

</body>
</html>
